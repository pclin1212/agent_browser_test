<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New issue - telemetry-dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site" id="site-header"></header>
<main>
  <nav class="breadcrumb">root / telemetry-dashboard / issues / <strong>new</strong></nav>
  <div class="form">
    <h1>New issue</h1>
    <label for="issue-title">Title</label>
    <input id="issue-title" type="text" placeholder="How can we reproduce the problem?">
    <label for="issue-description">Description</label>
    <textarea id="issue-description" rows="6" placeholder="Describe the bug or the feature request in detail."></textarea>
    <label>Label</label>
    <div class="dropdown" id="label-dropdown">
      <button class="dropdown-toggle" id="label-toggle" type="button">Select a label</button>
      <div class="dropdown-menu" id="label-menu" hidden></div>
    </div>
    <button class="btn-submit" id="create-issue-btn" type="button">Create issue</button>
    <div class="err" id="new-issue-err"></div>
  </div>
</main>
<script src="/data.js"></script>
<script src="/app.js"></script>
<script>
  MG.renderHeader();
  MG.initIssueForm();
</script>
</body>
</html>
