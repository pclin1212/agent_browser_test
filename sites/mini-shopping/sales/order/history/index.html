<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders - One Stop Market</title>
  <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<header class="site">
  <a class="logo" href="/">One Stop Market</a>
  <a href="../../../../customer/account/">My Account</a>
  <a href="../../../../checkout/cart/">Cart</a>
</header>
<main>
  <nav class="breadcrumb"><a href="../../../../">Home</a> / <a href="../../../../customer/account/">My Account</a> / My Orders</nav>
  <div id="orders-box"></div>
</main>
<script src="../../../data.js"></script>
<script src="../../../app.js"></script>
<script>
  MS.requireAuth();
  var html = "<h1>My Orders</h1><table id='my-orders-table'>" +
    "<tr><th>Order #</th><th>Date</th><th>Order Total</th><th>Status</th><th>Action</th></tr>";
  MS_ORDERS.forEach(function (o) {
    html += "<tr><td>" + o.id + "</td><td>" + o.date + "</td><td>$" + o.total +
      "</td><td><em>" + o.status + "</em></td><td><a href='../../view/order_id/" + o.id + "/'>View Order</a></td></tr>";
  });
  html += "</table>";
  document.getElementById("orders-box").innerHTML = html;
</script>
</body>
</html>
